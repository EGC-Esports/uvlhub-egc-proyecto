# ----------------------------------------------------------------------------
# Lint
# flake8, black e isort sobre todo el código Python. La configuración de las
# tres está en pyproject.toml y las versiones, fijadas en requirements-lint.in,
# son las mismas que usa el hook pre-commit.
#
# Se instalan desde requirements-lint.txt, un lock generado con todas las
# dependencias, sus hashes y solo wheels: --require-hashes rechaza cualquier
# paquete que no coincida con el hash, y --only-binary :all: impide ejecutar
# scripts de instalación de paquetes en código fuente.
# ----------------------------------------------------------------------------

name: Lint

on:
  push:
    branches: ['**']

permissions:
  contents: read

env:
  LINT_PATHS: app rosemary scripts tests

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Instalar Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Instalar las herramientas de lint
        run: 'pip install --only-binary :all: --require-hashes -r requirements-lint.txt'

      - name: flake8
        run: flake8 $LINT_PATHS

      - name: black
        if: ${{ !cancelled() }}
        run: black --check --diff $LINT_PATHS

      - name: isort
        if: ${{ !cancelled() }}
        run: isort --check-only --diff $LINT_PATHS

# Configuración de SonarCloud (la usa .github/workflows/sonar.yml).
# Comprobar organization y projectKey en SonarCloud → Information del proyecto:
# estos son los que pone por defecto al importar EGC-Esports/uvlhub-egc-proyecto.
sonar.organization=egc-esports
sonar.projectKey=EGC-Esports_uvlhub-egc-proyecto
sonar.projectName=uvlhub-egc-proyecto

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Código de producción: la aplicación, la CLI y los scripts de CI.
sonar.sources=app,rosemary/src,scripts
# Las pruebas viven junto a cada feature (app/features/*/tests) y en tests/.
sonar.tests=app,tests
sonar.test.inclusions=app/features/*/tests/**,tests/**
# Fuera del análisis: pruebas (ya van en sonar.tests) y librerías empaquetadas.
sonar.exclusions=app/features/*/tests/**,app/static/js/app.js,app/static/css/app.css,app/static/css/dropzone.css,**/*.map

# Informe que genera tests.yml y que sonar.yml descarga del run de Tests.
sonar.python.coverage.reportPaths=coverage.xml
